<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="50%" stop-color="#12121a" />
      <stop offset="100%" stop-color="#0e0e17" />
    </linearGradient>

    <!-- Cyan to Purple Neon Accent Gradient -->
    <linearGradient id="neon-cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="60%" stop-color="#7b61ff" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#9d86ff" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7b61ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 46px;
      fill: #ffffff;
    }
    .highlight {
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 22px;
      fill: #00d4ff;
      letter-spacing: 2px;
    }
    .tagline {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      fill: #9d9daf;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #e8e8ef;
    }
    .badge-pill {
      fill: rgba(255, 255, 255, 0.04);
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    .grid-line {
      stroke: rgba(255, 255, 255, 0.03);
      stroke-width: 1;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg-grad)" />

  <!-- Background Grid Pattern -->
  <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
  <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
  <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
  <line x1="200" y1="0" x2="200" y2="340" class="grid-line" />
  <line x1="400" y1="0" x2="400" y2="340" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="340" class="grid-line" />
  <line x1="800" y1="0" x2="800" y2="340" class="grid-line" />
  <line x1="1000" y1="0" x2="1000" y2="340" class="grid-line" />

  <!-- Ambient Neon Glowing Orbs matching portfolio hero -->
  <circle cx="150" cy="80" r="100" fill="#00d4ff" opacity="0.15" filter="url(#glow-cyan)" />
  <circle cx="1050" cy="180" r="130" fill="#7b61ff" opacity="0.18" filter="url(#glow-purple)" />
  <circle cx="600" cy="300" r="80" fill="#00d4ff" opacity="0.1" filter="url(#glow-cyan)" />

  <!-- Outer Glass Frame Border -->
  <rect x="1" y="1" width="1198" height="338" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Left Accent Decorative Vertical Bar -->
  <rect x="60" y="70" width="4" height="195" rx="2" fill="url(#neon-cyan-purple)" filter="url(#soft-glow)" />

  <!-- Greeting & Status -->
  <g transform="translate(85, 95)">
    <!-- Active Status Pulse -->
    <circle cx="6" cy="6" r="5" fill="#00d4ff" filter="url(#soft-glow)" />
    <circle cx="6" cy="6" r="3" fill="#ffffff" />
    <text x="24" y="10" class="subtitle">SOFTWARE ENGINEER &amp; QA SPECIALIST</text>
  </g>

  <!-- Main Name Title -->
  <text x="85" y="165" class="title">
    Banuka <tspan class="highlight">Nanayakkara</tspan> ⚡
  </text>

  <!-- Tagline matching portfolio -->
  <text x="85" y="205" class="tagline">
    Bridging the gap between building &amp; breaking software with quality and precision.
  </text>

  <!-- Core Highlights Badges -->
  <g transform="translate(85, 235)">
    <!-- Pill 1: Machine Learning -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="17" class="badge-pill" />
      <circle cx="18" cy="17" r="4" fill="#00d4ff" />
      <text x="32" y="22" class="badge-text">Machine Learning</text>
    </g>

    <!-- Pill 2: Computer Vision -->
    <g transform="translate(195, 0)">
      <rect width="170" height="34" rx="17" class="badge-pill" />
      <circle cx="18" cy="17" r="4" fill="#7b61ff" />
      <text x="32" y="22" class="badge-text">Computer Vision</text>
    </g>

    <!-- Pill 3: QA & Automation -->
    <g transform="translate(380, 0)">
      <rect width="175" height="34" rx="17" class="badge-pill" />
      <circle cx="18" cy="17" r="4" fill="#00d4ff" />
      <text x="32" y="22" class="badge-text">Test Automation</text>
    </g>

    <!-- Pill 4: Full-Stack Dev -->
    <g transform="translate(570, 0)">
      <rect width="150" height="34" rx="17" class="badge-pill" />
      <circle cx="18" cy="17" r="4" fill="#7b61ff" />
      <text x="32" y="22" class="badge-text">Full-Stack Dev</text>
    </g>
  </g>

  <!-- Right Side Decorative Geometric Brand Graphic -->
  <g transform="translate(970, 85)" opacity="0.85">
    <rect x="0" y="0" width="130" height="130" rx="24" fill="rgba(255, 255, 255, 0.02)" stroke="url(#border-grad)" stroke-width="1.5" />
    <text x="65" y="78" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="44" fill="#ffffff">
      B<tspan fill="#00d4ff">N</tspan>
    </text>
    <text x="65" y="104" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#9d9daf" letter-spacing="1">PORTFOLIO</text>
  </g>
</svg>
